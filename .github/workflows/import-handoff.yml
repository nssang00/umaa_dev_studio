name: Import v0.9.1 handoff

on:
  push:
    branches: [main]
    paths:
      - 'handoff/UMAA_Development_Studio_HANDOFF_2026-11-05_v0.9.1.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handoff-import-main
  cancel-in-progress: false

jobs:
  import-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract original handoff
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          file="handoff/UMAA_Development_Studio_HANDOFF_2026-11-05_v0.9.1.zip"
          test -f "$file"
          unzip -tq "$file"
          mkdir -p "$RUNNER_TEMP/umaa-handoff"
          unzip -q "$file" -d "$RUNNER_TEMP/umaa-handoff"
          root="$RUNNER_TEMP/umaa-handoff/UMAA_Development_Studio_HANDOFF_2026-11-05_v0.9.1"
          test -f "$root/project/package.json"
          test -f "$root/START_HERE.md"
          rsync -a "$root/project/" ./
          mkdir -p handoff/docs
          cp -a "$root/docs/." handoff/docs/
          cp "$root/START_HERE.md" handoff/START_HERE.md
          cp "$root/MANIFEST.json" handoff/MANIFEST.json
          cp "$root/SHA256SUMS.txt" handoff/SHA256SUMS.txt
          rm "$file"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Restored project and handoff files"
      - uses: actions/setup-node@v4
        if: steps.unpack.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install and create lockfile
        id: install
        if: steps.unpack.outputs.ready == 'true'
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Run tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm test
          npm run test:struct-ui
      - name: Build UI
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Commit imported source (even if tests need fixing)
        if: steps.unpack.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import UMAA Development Studio v0.9.1 handoff"
            git push origin HEAD:main
          fi
      - name: Publish test/build outcome
        if: steps.unpack.outputs.ready == 'true'
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Install: $INSTALL, tests: $TESTS, build: $BUILD" >> "$GITHUB_STEP_SUMMARY"
          test "$INSTALL" = success
          test "$TESTS" = success
          test "$BUILD" = success
