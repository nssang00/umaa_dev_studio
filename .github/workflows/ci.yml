name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'handoff/*.zip'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure project has been imported
        run: test -f package.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Run unit and model tests
        run: npm test
      - name: Run struct UI test excluded from upstream npm test
        run: npm run test:struct-ui
      - name: Build UI
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: umaa-ui-dist
          path: dist/
          retention-days: 7
