name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node tests and browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Static, model, layout and UI-structure tests
        run: npm test
      - name: Build React application
        run: npm run build
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: umaa-ui-dist
          path: dist/
          retention-days: 7
      - name: Create reproducible source snapshot
        run: |
          mkdir -p handoff-artifact
          git archive --format=zip --output=handoff-artifact/umaa-source-snapshot.zip HEAD
      - name: Upload handoff source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: umaa-source-snapshot
          path: handoff-artifact/umaa-source-snapshot.zip
          retention-days: 7
