name: Restore UMAA v0.9.1 snapshot

on:
  push:
    branches: [main]
    paths:
      - '.handoff-import/payload.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-umaa-v0-9-1
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract handoff payload
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          b64=".handoff-import/payload.b64"
          test -s "$b64"
          base64 --decode "$b64" > "$RUNNER_TEMP/umaa-source.tar.xz"
          echo "03a560d220cfe0121c17226c1dabcb9de53350b2316882584721abdb25ff9161  $RUNNER_TEMP/umaa-source.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/umaa-source"
          tar -xJf "$RUNNER_TEMP/umaa-source.tar.xz" -C "$RUNNER_TEMP/umaa-source"
          test -f "$RUNNER_TEMP/umaa-source/package.json"
          test -f "$RUNNER_TEMP/umaa-source/src/App.jsx"
          test -f "$RUNNER_TEMP/umaa-source/handoff/START_HERE.md"
          # Do not update workflow files from the runner's restricted GITHUB_TOKEN.
          rsync -a --exclude='.github/' "$RUNNER_TEMP/umaa-source/" ./
          rm -rf .handoff-import
          cat > handoff/MIGRATION.md <<'EOF'
          # Migration completed
          Source: UMAA Development Studio v0.9.1 handoff ZIP (2026-11-05).
          The handoff's `project/` is now repository root. Original context is in `handoff/`.
          Historical binary source archives were intentionally not committed.
          CI tests the Node/model suite and builds the UI, not actual DDS interoperability.
          EOF
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Extracted 103-file source and handoff payload"
      - name: Install Node 22
        if: steps.unpack.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate lockfile
        id: install
        if: steps.unpack.outputs.ready == 'true'
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Run tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm test
          npm run test:struct-ui
      - name: Build browser bundle
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Commit source to main even if tests need fixes
        if: steps.unpack.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: migrate UMAA Development Studio v0.9.1 source"
            git push origin HEAD:main
          fi
      - name: Upload built UI (if present)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: umaa-v0.9.1-initial-build
          path: dist/
          retention-days: 7
      - name: Assert verification results
        if: steps.unpack.outputs.ready == 'true'
        env:
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Install: $INSTALL" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests: $TESTS" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: $BUILD" >> "$GITHUB_STEP_SUMMARY"
          test "$INSTALL" = success
          test "$TESTS" = success
          test "$BUILD" = success
