<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMAA Development Studio – Component First UX Concept</title>
<style>
:root{--ink:#1d2f47;--muted:#687b91;--line:#dfe7f0;--bg:#f5f7fb;--blue:#2861a4;--blue-soft:#eaf2ff;--green:#18745b;--amber:#a36419;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7aaaf7;outline-offset:2px}.shell{height:100vh;min-height:740px;display:grid;grid-template-columns:252px minmax(490px,1fr) 290px;grid-template-rows:65px minmax(0,1fr) 43px}.top{grid-column:1/4;background:#172d49;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:18px}.brand{display:flex;align-items:center;gap:12px;min-width:260px}.logo{background:#3869a5;border-radius:11px;padding:11px;font-size:18px}.brand b{display:block;font-size:15px;letter-spacing:-.3px}.brand small{font-size:11px;color:#b9c9df}.top-actions{display:flex;align-items:center;gap:10px}.project-crumb{border:1px solid #526982;color:#d5e4f4;border-radius:7px;padding:7px 9px;font-size:12px}.top button{border:1px solid #4d6785;background:#233e60;color:#f1f7fe;padding:8px 12px;border-radius:7px}.top .primary{background:#f9fcff;color:#1d3b65;border:0;font-weight:700}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;overflow:auto}.sidebar .caption{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#8696a9;font-weight:800;padding:5px 12px;margin:12px 0 5px}.sidebar .nav{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;text-align:left;padding:11px 13px;color:#4f6076;font-weight:600}.sidebar .nav.active{color:#194c86;background:var(--blue-soft)}.sidebar .nav span:last-child{margin-left:auto;color:#748598;font-size:11px}.sidebar hr{border:0;border-top:1px solid var(--line);margin:20px 5px}.comp-head{display:flex;align-items:center;justify-content:space-between;padding:0 10px}.comp-head b{font-size:12px}.plus{padding:2px 9px;background:#eaf2ff;color:#174d8e;border:0;border-radius:7px;font-size:19px}.comp-item{display:flex;gap:10px;align-items:flex-start;width:100%;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;padding:11px;margin-top:6px;color:#34475f}.comp-item.active{border-color:#bdd3ed;background:#f1f6fe}.comp-item .mini-icon{display:grid;place-items:center;width:30px;height:30px;background:#e7eef8;border-radius:8px}.comp-item b{display:block;font-size:12px}.comp-item small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.sidebar .minor{font-size:11px;color:#95a3b4;line-height:1.6;padding:14px 12px}.main{overflow:auto;min-width:0;padding:26px 34px 40px}.pretitle{display:flex;align-items:center;gap:9px;color:#6d8198;font-size:12px;font-weight:700;letter-spacing:.4px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:9px 0 20px}.heading h1{font-size:29px;line-height:1.18;letter-spacing:-.8px;margin:0}.heading p{margin:7px 0 0;color:var(--muted);font-size:13px}.tag{display:inline-flex;align-items:center;gap:4px;background:#e7f5ef;color:#1c7559;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:700}.tag.neutral{background:#edf2f7;color:#607087}.tag.amber{background:#fff3e4;color:#98601b}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden;margin-bottom:23px}.step{min-width:0;padding:17px 16px;border:0;border-right:1px solid var(--line);text-align:left;background:white;display:flex;align-items:center;gap:10px;color:#617286}.step:last-child{border-right:0}.step.active{box-shadow:inset 0 -3px 0 var(--blue);background:#f7faff;color:#1c4e85}.step.done .num{background:#daf4e8;color:#17785d}.step .num{display:grid;place-items:center;width:29px;height:29px;flex-shrink:0;background:#e9eef4;color:#617286;border-radius:50%;font-weight:800}.step b{display:block;font-size:12px}.step small{display:block;font-size:10px;margin-top:2px;color:#8090a4}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 7px #22344e04}.panel h2{margin:0 0 7px;font-size:16px;letter-spacing:-.2px}.panel p.sub{color:var(--muted);margin:0 0 20px;line-height:1.6;font-size:12px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-head h2{margin:0}.outline{border:1px solid #bbcee1;background:#fff;color:#22558d;font-weight:700;border-radius:8px;padding:9px 13px}.solid{background:var(--blue);border:1px solid var(--blue);color:#fff;border-radius:8px;padding:10px 16px;font-weight:700}.ghost{background:transparent;border:0;color:#2b669d;font-weight:700;padding:7px}.hint{font-size:11px;color:var(--muted);line-height:1.5}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.role-box{border:1px solid var(--line);border-radius:10px;overflow:hidden}.role-head{background:#f7f9fc;padding:12px 14px;font-weight:800;font-size:12px;display:flex;justify-content:space-between;align-items:center}.role-head span{font-size:11px;color:#7c8da2}.service{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border:0;background:#fff;border-top:1px solid #eff2f6}.service:hover,.service.selected{background:#f5f9ff}.service .dot{width:7px;height:7px;border-radius:50%;background:#278b74;flex-shrink:0}.service.consumer .dot{background:#c28736}.service b{display:block;font-size:12px;font-weight:700}.service small{display:block;color:#8796a6;font-size:10px;margin-top:3px}.service .chev{margin-left:auto;color:#90a1b4}.role-footer{border-top:1px dashed var(--line);padding:11px;text-align:center}.role-footer button{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700}.info-strip{background:#f0f6fd;border:1px solid #d7e7f6;border-radius:9px;padding:12px 14px;color:#456783;font-size:12px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}.task-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px}.right{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:24px 17px}.right h2{font-size:12px;color:#8091a5;text-transform:uppercase;letter-spacing:.8px;margin:2px 0 12px}.context{font-size:17px;font-weight:800;line-height:1.4;margin:0 0 6px}.right p{color:var(--muted);font-size:12px;line-height:1.65}.right .right-card{padding:15px;border-radius:11px;border:1px solid var(--line);margin:12px 0 18px;background:#fafcff}.check{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:12px;color:#53657b;line-height:1.5}.check .mark{color:#1a8a69}.check .warn{color:#b27c26}.right button{width:100%;margin-top:9px}.right .textlink{width:auto;margin:0;background:transparent;border:0;color:var(--blue);font-size:12px;text-align:left;padding:5px 0}.bottom{grid-column:1/4;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 19px;gap:10px;font-size:12px;color:#64778d}.bottom .clickable{cursor:pointer;border:0;background:transparent;color:#365f8f;font-weight:700}.bottom .dev{border:0;background:transparent;color:#8899aa}.form-row{display:flex;gap:16px;margin:15px 0}.field{flex:1}.field label{display:block;margin-bottom:7px;color:#52667e;font-weight:700;font-size:12px}.field input,.field select{border:1px solid #cbd8e6;border-radius:8px;background:white;padding:10px 12px;width:100%;color:#1d2f47}.preset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0}.preset{border:1px solid #cdddec;background:#fff;border-radius:10px;padding:14px;text-align:left}.preset.active{border-color:#74a7e6;background:#f3f8ff}.preset b{display:block;margin-bottom:5px}.preset small{font-size:11px;color:var(--muted)}.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.status-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf0f5;gap:8px;font-size:12px}.status-row:last-child{border:0}.status-row b{font-weight:700}.status-yes{color:#178263}.status-no{color:#a46b28}.list{padding:0;margin:0;list-style:none}.list li{padding:12px 0;border-bottom:1px solid #edf1f7;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.list li:last-child{border:0}.muted{color:var(--muted)}.modal-overlay{position:fixed;inset:0;background:#1a2d49a8;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modal-overlay.open{display:flex}.modal{width:min(590px,100%);max-height:85vh;overflow:auto;background:white;border-radius:15px;box-shadow:0 20px 60px #142d4880;padding:25px}.modal h2{margin:0 0 8px;font-size:20px}.modal header{display:flex;justify-content:space-between;align-items:start;gap:16px}.modal header button{border:0;background:transparent;font-size:22px;color:#678}.modal .catalog-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;gap:12px}.catalog-item small{display:block;margin-top:5px;color:var(--muted)}.catalog-item button{white-space:nowrap}.stack{display:flex;flex-direction:column;gap:12px}.advanced{display:none}.advanced.visible{display:block}.alert{color:#8f6022;background:#fff8ee;border:1px solid #f0ddb7;padding:12px 14px;border-radius:9px;font-size:12px;line-height:1.6}.hr{height:1px;background:var(--line);margin:18px 0}.pill{font-size:10px;border:1px solid #d7e4f0;border-radius:12px;padding:3px 7px;color:#557087}.empty{color:var(--muted);font-size:12px;padding:12px}.hide{display:none!important}
@media(max-width:1230px){.shell{grid-template-columns:205px minmax(490px,1fr);}.right{display:none}.main{padding:22px}.brand small,.project-crumb{display:none}}
@media(max-width:760px){.shell{display:block;height:auto;min-height:100vh;padding-bottom:48px}.top{position:sticky;top:0;z-index:5;height:59px;padding:0 12px}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:9px}.sidebar .caption,.sidebar hr,.comp-head,.comp-item,.sidebar .minor{display:none}.sidebar .nav{display:inline-flex;width:auto;padding:8px 10px}.main{padding:16px}.heading h1{font-size:22px}.steps,.role-grid,.build-grid,.preset-grid{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}.bottom{position:fixed;bottom:0;left:0;right:0;height:43px}.top-actions .secondary{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="logo">▤</span><span><b>UMAA Development Studio</b><small>Component-first UX / 독립형 개념 시안 · 실제 코드 생성기 아님</small></span></div><div class="top-actions"><span class="project-crumb">Demo Project / UMAA 6.0</span><button class="secondary" onclick="toggleAdvanced()">⚙ 고급 도구</button><button class="primary" onclick="goView('build')">생성 준비 확인 →</button></div></header>
<aside class="sidebar">
<div class="caption">Workspace</div>
<button class="nav active" data-nav="components" onclick="goView('components')">▦ &nbsp;내 컴포넌트 <span>2</span></button>
<button class="nav" data-nav="assembly" onclick="goView('assembly')">⤴ &nbsp;시스템 연결</button>
<button class="nav" data-nav="library" onclick="goView('library')">▤ &nbsp;서비스 라이브러리</button>
<button class="nav" data-nav="build" onclick="goView('build')">▧ &nbsp;생성 결과</button>
<hr><div class="comp-head"><b>내 컴포넌트</b><button class="plus" onclick="openModal('new')" title="컴포넌트 추가">+</button></div>
<button class="comp-item active" data-comp="autopilot" onclick="chooseComp('autopilot')"><span class="mini-icon">▣</span><span><b>My Autopilot</b><small>프로젝트 예제 · 5개 Service</small></span></button>
<button class="comp-item" data-comp="mission" onclick="chooseComp('mission')"><span class="mini-icon">▣</span><span><b>Mission Executor</b><small>프로젝트 예제 · 2개 Service</small></span></button>
<div class="minor">표준 정의는 보호됩니다.<br>사용자 Component와 프로젝트 확장은 별도로 관리합니다.</div>
</aside>
<main class="main" id="main-content" aria-live="polite"></main>
<aside class="right" id="right-content"></aside>
<footer class="bottom"><div><span style="color:#148166">●</span> 프로젝트 예제 &nbsp;·&nbsp; <button class="clickable" onclick="openModal('issues')">⚠ 검토 항목 1개 보기</button></div><div><span>UX 시안: 화면 이동과 Service 추가를 체험할 수 있습니다.</span> <button class="dev" onclick="toggleAdvanced()">기술 정보 ▸</button></div></footer>
</div>
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true"><div class="modal" id="modal-body"></div></div>
<script>
const DATA={autopilot:{name:'My Autopilot',description:'차량의 주행 제어 기능을 제공하는 프로젝트 Component입니다.',services:[{name:'GlobalVectorControl',role:'provider',fa:'MO',desc:'차량 속도와 진행방향 제어'},{name:'PrimitiveDriverControl',role:'provider',fa:'MO',desc:'기본 구동 제어'},{name:'GlobalPoseStatus',role:'consumer',fa:'SA',desc:'자함 위치 및 자세 수신'},{name:'SpeedStatus',role:'consumer',fa:'SA',desc:'자함 속력 수신'},{name:'VelocityStatus',role:'consumer',fa:'SA',desc:'자함 속도 벡터 수신'}]},mission:{name:'Mission Executor',description:'미션을 실행하고 관련 서비스의 상태를 구독합니다.',services:[{name:'ConditionalReport',role:'provider',fa:'MM',desc:'조건 상태 보고'},{name:'GlobalVectorControl',role:'consumer',fa:'MO',desc:'차량 제어 명령 요청'}]}};
const catalog=[['GlobalHoverControl','MO','Hover 자세 유지 및 제어'],['GlobalWaypointControl','MO','웨이포인트 기반 제어'],['HealthReport','SO','컴포넌트 건전성 보고'],['LogReport','SO','로그 메시지 보고'],['WindStatus','SA','바람 정보 제공'],['WaterCurrentStatus','SA','해류 정보 제공']];
let selected='autopilot',view='components',step=2,advanced=false,focusService='',buildPreview=false;const $=id=>document.getElementById(id);
function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStep(v){step=v;view='components';render();}
function goView(v){view=v;render();}
function chooseComp(v){selected=v;step=2;view='components';focusService='';render();}
function toggleAdvanced(){advanced=!advanced;render();}
function stageButtons(){return `<div class="steps"><button class="step ${step===1?'active':step>1?'done':''}" onclick="setStep(1)"><span class="num">${step>1?'✓':'1'}</span><span><b>Component 정의</b><small>이름과 시작 방법</small></span></button><button class="step ${step===2?'active':step>2?'done':''}" onclick="setStep(2)"><span class="num">${step>2?'✓':'2'}</span><span><b>서비스 선택</b><small>Provider / Consumer</small></span></button><button class="step ${step===3?'active':''}" onclick="setStep(3)"><span class="num">3</span><span><b>설정 · 생성 준비</b><small>검증 및 코드 골격</small></span></button></div>`;}
function render(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===view));document.querySelectorAll('[data-comp]').forEach(el=>el.classList.toggle('active',el.dataset.comp===selected));if(view==='components')renderComponent();else if(view==='assembly')renderAssembly();else if(view==='library')renderLibrary();else renderBuild();renderRight();}
function renderComponent(){const c=DATA[selected],providers=c.services.filter(s=>s.role==='provider'),consumers=c.services.filter(s=>s.role==='consumer');const intro=`<div class="pretitle">내 컴포넌트 &nbsp;/&nbsp; ${h(c.name)}</div><div class="heading"><div><h1>${h(c.name)}</h1><p>${h(c.description)}</p></div><span class="tag neutral">프로젝트 정의</span></div>${stageButtons()}`;
let body='';if(step===1){body=`<section class="panel"><h2>무엇을 만들까요?</h2><p class="sub">처음에는 이름과 기반 템플릿만 선택합니다. 세부 DDS 설정은 나중에 확인합니다.</p><div class="form-row"><div class="field"><label>Component 이름</label><input id="component-name" value="${h(c.name)}"></div></div><label style="font-weight:700;font-size:12px">시작 방식</label><div class="preset-grid"><button class="preset active"><b>▦ UMAA 참조 구성에서 시작</b><small>표준 서비스 후보를 가져온 뒤 프로젝트에 맞게 선택</small></button><button class="preset" onclick="openModal('new')"><b>＋ 빈 Component</b><small>처음부터 Service 조합</small></button></div><div class="info-strip">ⓘ 참조 Component와 프로젝트 구현은 구분됩니다. 템플릿을 사용해도 UMAA 적합성이 자동 보장되지는 않습니다.</div><div class="task-row"><span class="hint">이 시안에서 이름 변경은 데모 상태에만 반영됩니다.</span><button class="solid" onclick="renameComponent()">저장하고 서비스 선택 →</button></div></section>`}
else if(step===2){const roleBox=(list,title,role)=>`<div class="role-box"><div class="role-head">${title}<span>${list.length}개</span></div>${list.length?list.map(s=>`<button class="service ${role==='consumer'?'consumer':''} ${focusService===s.name?'selected':''}" onclick="selectService('${h(s.name)}')"><span class="dot"></span><span><b>${h(s.name)}</b><small>${h(s.fa)} · ${h(s.desc)}</small></span><span class="chev">›</span></button>`).join(''):'<div class="empty">선택된 서비스가 없습니다.</div>'}<div class="role-footer"><button onclick="openModal('service','${role}')">＋ ${title} 추가</button></div></div>`;body=`<section class="panel"><div class="panel-head"><div><h2>필요한 서비스를 선택하세요</h2><p class="sub" style="margin:5px 0 0">기능을 선택하면 해당 Interface, Operation, Topic, Type은 자동으로 참조됩니다.</p></div><button class="outline" onclick="openModal('service','provider')">＋ 서비스 추가</button></div><div class="role-grid">${roleBox(providers,'제공하는 기능','provider')}${roleBox(consumers,'사용하는 기능','consumer')}</div><div class="hr"></div><div class="info-strip">ⓘ Provider는 이 Component가 기능을 제공한다는 뜻입니다. Consumer는 다른 제공자의 서비스를 이용한다는 뜻입니다. 실제 DDS Writer/Reader 방향은 Operation에 따라 자동 계산됩니다.</div><div class="task-row"><button class="ghost" onclick="setStep(1)">‹ Component 정보</button><button class="solid" onclick="setStep(3)">설정 및 생성 준비 →</button></div></section><section class="panel"><div class="panel-head"><h2>고급 계약 정보</h2><button class="ghost" onclick="toggleAdvanced()">${advanced?'접기 −':'필요할 때 펼치기 +'}</button></div><div class="advanced ${advanced?'visible':''}"><p class="sub">읽기 전용 표준 Service Contract와 DDS 채널, MessageType을 확인합니다. 표준 정의는 여기서 수정하지 않습니다.</p><div class="status-row"><span>Service Interface / Operation</span><b>${c.services.length}개 서비스 참조</b></div><div class="status-row"><span>DDS Topic / MessageType</span><b>역할에 따라 자동 파생</b></div><div class="status-row"><span>IDL 원본 검증</span><b class="status-no">공식 IDL 별도 연결 필요</b></div></div></section>`;}
else {body=`<section class="panel"><h2>빌드 준비를 확인하세요</h2><p class="sub">필요한 설정만 확인합니다. 고급 QoS는 기본값을 사용하고 필요할 때 펼칠 수 있습니다.</p><div class="build-grid"><div class="field"><label>대상 운영체제</label><select id="target"><option>Linux (.so)</option><option>Windows (.dll)</option></select></div><div class="field"><label>DDS 실행 환경 (예정)</label><select><option>Fast DDS</option><option>RTI Connext DDS</option></select></div></div><div class="form-row"><div class="field"><label>DDS Domain ID</label><input type="number" min="0" value="0"></div><div class="field"><label>QoS Profile</label><select><option>Project Default (예제)</option></select></div></div><div class="alert">⚠ Command 서비스의 충돌 처리 정책 및 실제 DDS Runtime/IDL 연동은 아직 구현·검증되지 않았습니다. 이 시안의 검증 상태는 데모 표시입니다.</div><div class="task-row"><button class="ghost" onclick="setStep(2)">‹ 서비스 선택</button><button class="solid" onclick="goView('build')">생성 결과 확인 →</button></div></section>`;}
$('main-content').innerHTML=intro+body;}
function renderAssembly(){$('main-content').innerHTML=`<div class="pretitle">워크스페이스 / 시스템 구성</div><div class="heading"><div><h1>시스템 연결</h1><p>컴포넌트 간 서비스 사용 관계를 구성합니다. 독립 Component의 코드 골격 생성에는 필수가 아닙니다.</p></div><span class="tag neutral">선택 작업</span></div><section class="panel"><h2>Component Assembly</h2><p class="sub">논리적 Provider/Consumer 관계이며 DDS의 1:1 물리 링크를 의미하지 않습니다.</p><div class="role-grid"><div class="role-box"><div class="role-head">Mission Executor <span>Consumer</span></div><div style="padding:25px 14px;text-align:center"><b>GlobalVectorControl</b><p class="hint">Command 발행 / Status 수신</p></div></div><div class="role-box"><div class="role-head">My Autopilot <span>Provider</span></div><div style="padding:25px 14px;text-align:center"><b>GlobalVectorControl</b><p class="hint">Command 수신 / Status 발행</p></div></div></div><div class="info-strip" style="margin-top:16px">→ 서비스 간 논리 연결이 설정되면 개별 DDS 채널은 계약에서 파생합니다. 실제 Domain, Partition, QoS 매칭은 별도 검증합니다.</div><div class="task-row"><span class="hint">개념 시안 — 실시간 노드 편집은 기존 React Flow 화면을 유지할 수 있습니다.</span><button class="outline" onclick="goView('components')">Component로 돌아가기</button></div></section>`;}
function renderLibrary(){$('main-content').innerHTML=`<div class="pretitle">참조 카탈로그 / UMAA 6.0</div><div class="heading"><div><h1>서비스 라이브러리</h1><p>서비스를 목적에 따라 찾아보고 Component에 추가합니다.</p></div><span class="tag neutral">UMAA 표준 읽기 전용</span></div><section class="panel"><h2>내가 필요한 기능 찾기</h2><p class="sub">처음부터 Operation이나 Topic을 고르지 않아도 됩니다.</p><input style="width:100%;padding:13px;border:1px solid #cbd8e6;border-radius:9px" placeholder="예: 속도, 위치, 경로, 상태, 로그" id="library-search" oninput="filterLibrary()"><div id="library-items">${catalog.map(s=>`<div class="catalog-item"><div><b>${h(s[0])}</b><small>${h(s[1])} · ${h(s[2])}</small></div><button class="outline" onclick="openModal('service','consumer')">컴포넌트에 추가</button></div>`).join('')}</div><p class="hint">실제 프로젝트의 라이브러리 범위는 현재 v0.8.2에 적재된 큐레이션 서비스로 제한됩니다.</p></section>`;}
function filterLibrary(){let v=($('library-search')?.value||'').toLowerCase();document.querySelectorAll('#library-items .catalog-item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(v)?'flex':'none');}
function renderBuild(){$('main-content').innerHTML=`<div class="pretitle">산출물 / ${h(DATA[selected].name)}</div><div class="heading"><div><h1>생성 및 빌드</h1><p>현재 가능한 것과 실제 적용 전에 남은 일을 구분합니다.</p></div><span class="tag amber">코드 골격 단계</span></div><section class="panel"><div class="panel-head"><h2>현재 프로젝트로 만들 수 있는 결과물</h2><button class="outline" onclick="setStep(3)">설정 검토</button></div><div class="build-grid"><div><div class="status-row"><span>CMake / C++ 코드 골격</span><b class="status-yes">생성 가능</b></div><div class="status-row"><span>Custom IDL / Endpoint 계약 JSON</span><b class="status-yes">생성 가능</b></div><div class="status-row"><span>로컬 DLL / SO 실제 컴파일</span><b class="status-no">별도 환경 필요</b></div><div class="status-row"><span>실제 DDS 통신 / 호환성 검증</span><b class="status-no">미구현</b></div></div><div class="right-card" style="border:1px solid #e3eaf3;background:#fafcff;padding:16px;border-radius:10px"><h2 style="font-size:14px">${h(DATA[selected].name)}</h2><p class="hint">${DATA[selected].services.length}개 Service 바인딩</p><p class="hint">UMAA 6.0 참조 · C++ Shared Library 스캐폴드</p><button class="solid" onclick="showGeneration()">생성 파일 예시 보기</button></div></div>${buildPreview?`<div class="hr"></div><h2>생성 예시</h2><ul class="list"><li>src/component.cpp <span class="pill">C++ 골격</span></li><li>include/component_api.h <span class="pill">C ABI</span></li><li>generated/endpoints.hpp <span class="pill">계약 메타데이터</span></li><li>CMakeLists.txt <span class="pill">빌드 구성</span></li><li>config/dds-profile.json <span class="pill">실제 DDS에 미적용</span></li></ul><div class="alert">파일 목록은 UX 설명용입니다. 이 HTML 시안은 ZIP을 생성하지 않으며, 실제 파일 생성은 기존 React 프로젝트의 코드 생성기가 담당합니다.</div>`:''}</section>`;}
function showGeneration(){buildPreview=true;render();}
function selectService(name){focusService=name;render();}
function renderRight(){const c=DATA[selected];if(view==='components'&&step===2){const s=c.services.find(x=>x.name===focusService);$('right-content').innerHTML=s?`<h2>선택한 서비스</h2><div class="context">${h(s.name)}</div><span class="tag neutral">${s.role==='provider'?'Provider':'Consumer'}</span><p>${h(s.desc)}</p><div class="right-card"><div class="check"><span class="mark">✓</span>표준 Service 계약 참조</div><div class="check"><span class="mark">✓</span>Operation / DDS 매핑 자동 조회</div><div class="check"><span class="warn">!</span>실제 DDS 런타임 별도 연결</div></div><h2>상세 정보</h2><p>Service Contract, Topic 및 MessageType은 기존 Workbench의 고급 화면에서 열 수 있도록 제안합니다.</p><button class="outline" onclick="toggleAdvanced()">계약 정보 ${advanced?'접기':'펼치기'}</button><button class="outline" onclick="removeService('${h(s.name)}')">이 바인딩 제거</button>`:`<h2>현재 단계</h2><div class="context">Service 구성을 확인하세요</div><p>무엇을 제공하고, 다른 Component에서 어떤 기능을 사용할지 정합니다.</p><div class="right-card"><b>검토 항목</b><div class="check"><span class="mark">✓</span>Component 생성됨</div><div class="check"><span class="mark">✓</span>Service ${c.services.length}개 연결됨</div><div class="check"><span class="warn">!</span>빌드 전 Runtime 정책 검토</div></div><button class="solid" onclick="setStep(3)">다음: 설정 확인 →</button><div class="hr"></div><h2>왜 필요한가요?</h2><p>표준 Service를 고르면 ICD에 정의된 Operation과 Topic을 자동 참조합니다. 처음부터 DDS 상세 구조를 외울 필요가 없습니다.</p>`;return;}
if(view==='components'&&step===1){$('right-content').innerHTML=`<h2>현재 단계</h2><div class="context">어떤 Component를 만들까요?</div><p>UMAA 참조 Component에서 시작하거나 빈 Component를 만들어 기능을 선택할 수 있습니다.</p><div class="right-card"><b>설계 원칙</b><div class="check"><span class="mark">✓</span>표준 Service는 보호</div><div class="check"><span class="mark">✓</span>프로젝트 설정은 별도 관리</div></div><button class="solid" onclick="setStep(2)">서비스 선택 →</button>`;return;}
if(view==='components'&&step===3){$('right-content').innerHTML=`<h2>다음 할 일</h2><div class="context">설정을 검토하세요</div><p>기본 설정을 적용했더라도 실제 DDS 호환성 검증은 별도로 필요합니다.</p><div class="right-card"><div class="check"><span class="mark">✓</span>Component/Service 참조</div><div class="check"><span class="warn">!</span>Command Arbitration 미구현</div><div class="check"><span class="warn">!</span>실제 IDL/DDS 통합 필요</div></div><button class="solid" onclick="goView('build')">산출물 확인 →</button>`;return;}
$('right-content').innerHTML=`<h2>작업 안내</h2><div class="context">${view==='assembly'?'구성 관계 확인':view==='library'?'서비스 선택':'산출물의 범위를 확인'}</div><p>${view==='assembly'?'전체 시스템의 서비스 연결은 별도 화면에서 구성합니다.':'표준 계약과 프로젝트 확장을 분리하고 실제 구현 수준을 분명히 표시합니다.'}</p><div class="right-card"><b>작업 흐름</b><div class="check"><span class="mark">✓</span>Component 정의</div><div class="check"><span class="mark">✓</span>Service 구성</div><div class="check"><span class="warn">!</span>실제 빌드 / 통합 테스트는 별도</div></div><button class="outline" onclick="goView('components')">컴포넌트로 돌아가기</button>`;}
function removeService(name){if(!confirm(name+' Service Binding을 예제에서 제거할까요?'))return;DATA[selected].services=DATA[selected].services.filter(s=>s.name!==name);focusService='';render();}
function renameComponent(){const v=($('component-name')?.value||'').trim();if(!v)return alert('이름을 입력하세요.');DATA[selected].name=v;setStep(2);}
function openModal(kind,role='provider'){const ov=$('modal-overlay'),b=$('modal-body');ov.classList.add('open');if(kind==='service'){b.innerHTML=`<header><div><h2>서비스 추가</h2><p class="hint">필요한 기능을 찾아 선택하세요. 역할은 여기서 정할 수 있습니다.</p></div><button onclick="closeModal()" aria-label="닫기">×</button></header><div class="field" style="margin:17px 0"><label>이 Component에서의 역할</label><select id="add-role"><option value="provider" ${role==='provider'?'selected':''}>Provider — 기능 제공</option><option value="consumer" ${role==='consumer'?'selected':''}>Consumer — 기능 사용</option></select></div>${catalog.map((s,i)=>`<div class="catalog-item"><div><b>${h(s[0])}</b><small>${h(s[1])} · ${h(s[2])}</small></div><button class="outline" onclick="addService(${i})">추가</button></div>`).join('')}<div class="info-strip">ⓘ 실제 프로그램에서는 전체 공식 카탈로그, 사용자 Custom Service, ICD 출처 및 역할 충돌을 검사해야 합니다.</div>`;}else if(kind==='new'){b.innerHTML=`<header><h2>새 Component</h2><button onclick="closeModal()" aria-label="닫기">×</button></header><p class="hint">설명용 동작: 빈 Component를 새로 만들고 Service를 추가할 수 있습니다.</p><div class="field"><label>이름</label><input id="new-name" placeholder="My Sensor Fusion"></div><div class="task-row"><button class="outline" onclick="closeModal()">취소</button><button class="solid" onclick="addComponent()">만들기</button></div>`;}else if(kind==='issues'){b.innerHTML=`<header><h2>검토할 항목</h2><button onclick="closeModal()" aria-label="닫기">×</button></header><div class="alert">경고: Command/Response Provider의 명령 충돌 처리 정책이 미구현입니다. 이 알림은 현재 실제 소스의 검증 규칙을 참고한 UX 예시입니다.</div><div class="task-row"><button class="solid" onclick="closeModal();setStep(3)">관련 설정 보기 →</button></div>`;}}
function closeModal(){$('modal-overlay').classList.remove('open');}
function addService(index){const s=catalog[index],role=$('add-role').value;if(DATA[selected].services.some(x=>x.name===s[0]&&x.role===role))return alert('이미 동일한 역할로 선택했습니다.');DATA[selected].services.push({name:s[0],role,fa:s[1],desc:s[2]});focusService=s[0];closeModal();view='components';step=2;render();}
function addComponent(){const name=($('new-name')?.value||'').trim();if(!name)return alert('이름을 입력하세요.');let key='custom'+Object.keys(DATA).length;DATA[key]={name,description:'사용자가 생성한 새 Component입니다.',services:[]};const b=document.createElement('button');b.className='comp-item';b.dataset.comp=key;b.onclick=()=>chooseComp(key);b.innerHTML=`<span class="mini-icon">▣</span><span><b>${h(name)}</b><small>새 Component · 0개 Service</small></span>`;document.querySelector('.comp-head').after(b);selected=key;step=1;view='components';closeModal();render();}
$('modal-overlay').addEventListener('click',e=>{if(e.target===$('modal-overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body>
</html>
